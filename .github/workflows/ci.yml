name: CI

on:
  push:
    branches: [main, development, cleanup/recruiter-ready]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prevent committed runtime env files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A runtime .env file is tracked. Keep secrets out of Git."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
